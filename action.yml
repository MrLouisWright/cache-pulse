name: 'cache-pulse'
description: 'Check caching and precompression in your static hosting config'
author: 'Louis Wright'
branding: { icon: 'database', color: 'blue' }
inputs:
  path: { description: 'Built site directory (e.g. dist, public, _site)', default: '.' }
  base-url: { description: 'Public URL of the site, e.g. https://example.com', default: '' }
  fail-on: { description: 'critical | high | medium | low | info | none', default: 'high' }
  config: { description: 'Path to JSON config file', default: '' }
  sarif: { description: 'Write SARIF to this path', default: '' }
  json: { description: 'Write JSON report to this path', default: '' }
  job-summary: { description: 'Write the Markdown report to the job summary (true/false)', default: 'true' }
  args: { description: 'Extra CLI arguments', default: '' }
outputs:
  markdown-file: { description: 'Path of the Markdown report', value: '${{ steps.run.outputs.markdown-file }}' }
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: { node-version: '20' }
    - id: run
      shell: bash
      env:
        XB_PATH: ${{ inputs.path }}
        XB_BASE_URL: ${{ inputs.base-url }}
        XB_FAIL_ON: ${{ inputs.fail-on }}
        XB_CONFIG: ${{ inputs.config }}
        XB_SARIF: ${{ inputs.sarif }}
        XB_JSON: ${{ inputs.json }}
        XB_SUMMARY: ${{ inputs.job-summary }}
        XB_ARGS: ${{ inputs.args }}
        XB_BIN: ${{ github.action_path }}/bin/cache-pulse.js
      run: |
        md="$RUNNER_TEMP/cache-pulse.md"
        args=("$XB_PATH" --fail-on "$XB_FAIL_ON" --markdown "$md")
        [ -n "$XB_BASE_URL" ] && args+=(--base-url "$XB_BASE_URL")
        [ -n "$XB_CONFIG" ] && args+=(--config "$XB_CONFIG")
        [ -n "$XB_SARIF" ] && args+=(--sarif "$XB_SARIF")
        [ -n "$XB_JSON" ] && args+=(--json "$XB_JSON")
        set +e
        # shellcheck disable=SC2086
        node "$XB_BIN" "${args[@]}" $XB_ARGS
        code=$?
        set -e
        echo "markdown-file=$md" >> "$GITHUB_OUTPUT"
        if [ "$XB_SUMMARY" = "true" ] && [ -f "$md" ]; then cat "$md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code
